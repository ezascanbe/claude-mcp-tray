      <div class="titles">
        <h1>MCP Servers &amp; Extensions</h1>
        <p class="subtitle">Claude Desktop</p>
      </div>
      <button id="refresh" class="icon-btn" title="Reload config" aria-label="Reload config">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <section id="list" class="list" aria-live="polite"></section>

    <section id="pending" class="pending" hidden>
      <div class="pending-text">
        <strong>Restart Claude to apply</strong>
        <span id="pending-count"></span>
      </div>
      <div class="pending-actions">
        <button id="later" class="btn btn-ghost">Later</button>
        <button id="restart" class="btn btn-primary">Restart now</button>
      </div>
    </section>

    <div id="error" class="error" hidden></div>

    <footer class="footer">
      <span id="path" class="path" title=""></span>
      <button id="open-folder" class="link">Open folder</button>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
